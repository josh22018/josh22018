name: Refresh README cards

on:
  schedule:
    - cron: "17 1 * * *"   # every day, 06:47 IST
  workflow_dispatch:
  push:
    paths:
      - config.json
      - scripts/**

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python scripts/render_readme_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
